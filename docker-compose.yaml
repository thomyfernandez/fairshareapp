services:
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: "${JWT_SECRET:?Ejecutar python3 scripts/configurar.py}"
      JWT_EXPIRATION_MS: "${JWT_EXPIRATION_MS:-3600000}"
      SPRING_PROFILES_ACTIVE: local
    volumes:
      - fairshare-data:/app/data
  frontend:
    build:
      context: ${FRONTEND_CONTEXT:-../front-fairshareapp}
    ports:
      - "3000:80"
    depends_on:
      - backend
volumes:
  fairshare-data:
