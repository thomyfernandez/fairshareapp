spring.application.name=fairshare
spring.profiles.default=local
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
jwt.secret=${JWT_SECRET:fairshare-super-secret-key-that-is-at-least-32-bytes-long}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
server.port=${PORT:8080}
app.admin.email=${ADMIN_EMAIL:admin@fairshare.com}
app.admin.password=${ADMIN_PASSWORD:Admin123!}
